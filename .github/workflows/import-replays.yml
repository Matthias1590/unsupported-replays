          def download(item):
              path, url = item
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(url, timeout=300) as response, target.open("wb") as output:
                  while chunk := response.read(1024 * 1024):
                      output.write(chunk)

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(download, downloads))
          PY
      - name: Commit samples through Git LFS
        run: |
          git lfs install
          git lfs track "*.replay"
          find replays -type f -name '*.replay' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat > README.md <<'EOF'
          # Unsupported VALORANT replays

          Three replay samples for every available VALORANT build from 11.06 through 12.09, intended for implementing and validating older-build support in [vrfkit](https://github.com/yakisoba0728/vrfkit).

          Builds: `11.06`, `11.07`, `11.08`, `11.09`, `11.10`, `11.11`, `12.00`, `12.01`, `12.02`, `12.03`, `12.04`, `12.05`, `12.06`, `12.07`, `12.08`, `12.09`

          Replay binaries are stored with Git LFS. SHA-256 hashes are in `SHA256SUMS.txt`.
          EOF
          git config user.name "Matthias1590"
          git config user.email "Matthias1590@users.noreply.github.com"
          git add .gitattributes README.md SHA256SUMS.txt replays
          git commit -m "Add unsupported replay samples"
          git push
